<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="./style.css">
<title>Teshavoy Virtual Assistant</title>
</head>

<body>

<h1>🎙 Teshavoy Virtual Assistant</h1>

<button onclick="startListening()" 
style="padding:15px 30px;font-size:18px;cursor:pointer;">
Gapirishni boshlash
</button>

<button onclick="pauseAudio()" 
style="padding:15px 30px;font-size:18px;cursor:pointer; margin-left:10px;">
Tohtatish
</button>

<button onclick="resumeAudio()" 
style="padding:15px 30px;font-size:18px;cursor:pointer; margin-left:10px;">
Davom ettirish
</button>

<button onclick="stopAudio()" 
style="padding:15px 30px;font-size:18px;cursor:pointer; margin-left:10px;">
Toʻliq toʻxtatish
</button>

<p id="status" style="margin-top:20px;"></p>

<script>

const status = document.getElementById("status");

let currentAudio = null;

function playAudio(fileName) {
    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
    }
    currentAudio = new Audio(fileName);
    currentAudio.play();
}

function pauseAudio() {
    if (currentAudio && !currentAudio.paused) {
        currentAudio.pause();
        status.innerText = "Musiqa pauzada.";
    }
}

function resumeAudio() {
    if (currentAudio && currentAudio.paused) {
        currentAudio.play();
        status.innerText = "Musiqa davom ettirilmoqda.";
    }
}

function stopAudio() {
    if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
        status.innerText = "Musiqa toʻliq toʻxtatildi.";
    }
}

function startListening() {

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        alert("Brauzeringiz mos emas. Chrome ishlating.");
        return;
    }

    const recognition = new SpeechRecognition();
    recognition.lang = "uz-UZ";
    recognition.start();

    status.innerText = "Tinglanyapti...";

    recognition.onresult = function(event) {

        let userText = event.results[0][0].transcript.toLowerCase();
        status.innerText = "Siz aytdingiz: " + userText;

        if (userText.includes("salom")) {
            playAudio("1.wav");
        }
        else if (userText.includes("ahvollaring") || userText.includes("axvollaring") || userText.includes("yaxshimi") || userText.includes("qalay") || userText.includes("qanday")) {
            playAudio("2.wav");
        }
        else if (userText.includes("yangilik") || userText.includes("musiqa olami")) {
            playAudio("3.wav");
        }
        else if (userText.includes("haqingda gapir") || userText.includes("o'zing haqingda gapirib ber") || userText.includes("gapir")) {
            playAudio("4.wav");
        }
        else if (userText.includes("musiqa inson uchun") || userText.includes("musiqa")) {
            playAudio("5.wav");
        }
        else if (userText.includes("maqom") || userText.includes("o'zbek milliy musiqasi") || userText.includes("milliy musiqasi")) {
            playAudio("6.wav");
        }
        else if (userText.includes("kecha")) {
            playAudio("keca.wav");
        }
        else if (userText.includes("katta raxmat") || userText.includes("rahmat") || userText.includes("raxmat")) {
            playAudio("7.wav");
        }
        else {
            playAudio("tushunmadim.wav");
        }
    };

    recognition.onerror = function() {
        status.innerText = "Xatolik yuz berdi.";
        playAudio("uzr.mp3");
    };
}

</script>

</body>
</html>
